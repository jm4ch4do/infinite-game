<div id="setup-menu" class="absolute inset-0 z-10 flex items-center justify-center overflow-auto">
  <div class="relative z-10 flex flex-col items-center gap-6 p-8 text-center">
    <h1 class="mb-2 bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 bg-clip-text text-4xl font-black tracking-wider text-transparent drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">
      Game Setup
    </h1>

    <div class="flex w-72 flex-col gap-4">
      <label class="flex flex-col gap-1 text-left text-xs uppercase tracking-widest text-cyan-400/70">
        Player 1 (Left)
        <input
          id="player1-name-input"
          type="text"
          maxlength="16"
          placeholder="Player1"
          class="rounded-lg border border-cyan-500/50 bg-cyan-500/10 px-3 py-2 font-mono text-cyan-200 placeholder-cyan-400/40 outline-none focus:border-cyan-400"
        />
      </label>

      <label class="flex flex-col gap-1 text-left text-xs uppercase tracking-widest text-purple-400/70">
        Player 2 (Right)
        <input
          id="player2-name-input"
          type="text"
          maxlength="16"
          placeholder="Player2"
          class="rounded-lg border border-purple-500/50 bg-purple-500/10 px-3 py-2 font-mono text-purple-200 placeholder-purple-400/40 outline-none focus:border-purple-400"
        />
      </label>
    </div>

    <div class="flex w-72 flex-col gap-2 text-left">
      <span class="text-xs uppercase tracking-widest text-slate-400">Difficulty</span>
      <div class="flex gap-2">
        <button data-menu-item data-difficulty="easy" class="setup-option flex-1 rounded-lg border border-cyan-500/50 bg-cyan-500/10 py-2 text-sm font-bold tracking-widest text-cyan-400 transition-all duration-200 hover:bg-cyan-500/30">
          EASY
        </button>
        <button data-menu-item data-difficulty="medium" class="setup-option flex-1 rounded-lg border border-purple-500/50 bg-purple-500/10 py-2 text-sm font-bold tracking-widest text-purple-400 transition-all duration-200 hover:bg-purple-500/30">
          MEDIUM
        </button>
        <button data-menu-item data-difficulty="hard" class="setup-option flex-1 rounded-lg border border-pink-500/50 bg-pink-500/10 py-2 text-sm font-bold tracking-widest text-pink-400 transition-all duration-200 hover:bg-pink-500/30">
          HARD
        </button>
      </div>
    </div>

    <div class="flex w-72 flex-col gap-2 text-left">
      <span class="text-xs uppercase tracking-widest text-slate-400">Points to Win</span>
      <div class="flex gap-2">
        <button data-menu-item data-win-score="10" class="setup-option flex-1 rounded-lg border border-cyan-500/50 bg-cyan-500/10 py-2 text-sm font-bold tracking-widest text-cyan-400 transition-all duration-200 hover:bg-cyan-500/30">
          10
        </button>
        <button data-menu-item data-win-score="20" class="setup-option flex-1 rounded-lg border border-purple-500/50 bg-purple-500/10 py-2 text-sm font-bold tracking-widest text-purple-400 transition-all duration-200 hover:bg-purple-500/30">
          20
        </button>
        <button data-menu-item data-win-score="30" class="setup-option flex-1 rounded-lg border border-pink-500/50 bg-pink-500/10 py-2 text-sm font-bold tracking-widest text-pink-400 transition-all duration-200 hover:bg-pink-500/30">
          30
        </button>
      </div>
    </div>

    <div class="flex w-72 flex-col gap-4">
      <button data-menu-item data-action="start-setup" class="rounded-lg border border-cyan-500/50 bg-cyan-500/10 py-3 font-bold tracking-widest text-cyan-400 transition-all duration-300 hover:bg-cyan-500 hover:text-gray-950 hover:shadow-[0_0_20px_rgba(6,182,212,0.6)] active:scale-95">
        START
      </button>

      <button data-menu-item data-action="back" class="rounded-lg border border-pink-500/50 bg-pink-500/10 py-3 font-bold tracking-widest text-pink-400 transition-all duration-300 hover:bg-pink-500 hover:text-gray-950 hover:shadow-[0_0_20px_rgba(236,72,153,0.6)] active:scale-95">
        BACK
      </button>
    </div>
  </div>
</div>
